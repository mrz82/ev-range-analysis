name: reproduce

# Reproduces the full analysis from a clean environment and fails if any
# verification check (core results in 04_verify.R or robustness numbers in
# 05_sensitivity.R) drifts from the documented values.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'
          use-public-rspm: true   # fast binary package installs

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            cran::tidyverse
            cran::car
            cran::leaps
            cran::rmarkdown
            cran::knitr

      - name: Run full pipeline + verification gates
        run: Rscript R/run_all.R

      - name: Render self-contained HTML report
        run: Rscript R/render_report.R

      - name: Upload report, figures, and tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ev-range-report
          path: |
            report/ev_range_report.html
            figures/
            output/tables/
